x-benchmark-common: &benchmark-common
  build:
    context: .
    dockerfile: docker/Dockerfile
  volumes:
    - ./data/cache:/app/data/cache
    - ./results:/app/results

services:
  prepare-data:
    <<: *benchmark-common
    command: ["python", "experiments/prepare_real_city_data.py", "--grid-size", "${GRID_SIZE:-40}", "--require-real-data"]

  train:
    <<: *benchmark-common
    command:
      - python
      - experiments/train_real_city_policies.py
      - --agents
      - ${AGENTS:-8}
      - --grid-size
      - ${GRID_SIZE:-40}
      - --episodes
      - ${TRAIN_EPISODES:-108}
      - --validation-episodes
      - ${VALIDATION_EPISODES:-12}
      - --validation-repeats
      - ${VALIDATION_REPEATS:-2}
      - --teacher-bootstrap-scenarios
      - ${TEACHER_BOOTSTRAP_SCENARIOS:-9}
      - --max-steps
      - ${MAX_STEPS:-160}
      - --require-real-data

  upgrade-ppo:
    <<: *benchmark-common
    command:
      - python
      - experiments/upgrade_ppo_coordination_v5.py
      - --agents
      - ${AGENTS:-8}
      - --grid-size
      - ${GRID_SIZE:-40}
      - --rounds
      - ${PPO_UPGRADE_ROUNDS:-2}
      - --teacher-scenarios
      - ${PPO_TEACHER_SCENARIOS:-9}
      - --validation-episodes
      - ${VALIDATION_EPISODES:-12}
      - --validation-repeats
      - ${VALIDATION_REPEATS:-2}
      - --max-steps
      - ${MAX_STEPS:-160}
      - --require-real-data

  train-prism:
    <<: *benchmark-common
    command:
      - python
      - experiments/train_prism_patterns.py
      - --agents
      - ${AGENTS:-8}
      - --grid-size
      - ${GRID_SIZE:-40}
      - --rounds
      - ${PRISM_ROUNDS:-8}
      - --train-scenarios-per-candidate
      - ${PRISM_TRAIN_SCENARIOS:-4}
      - --validation-episodes
      - ${PRISM_VALIDATION_EPISODES:-8}
      - --validation-repeats
      - ${PRISM_VALIDATION_REPEATS:-2}
      - --max-steps
      - ${MAX_STEPS:-160}
      - --require-real-data

  test:
    <<: *benchmark-common
    command: ["python", "experiments/test_real_city_policies.py", "--agents", "${AGENTS:-8}", "--grid-size", "${GRID_SIZE:-40}", "--episodes", "${TEST_EPISODES:-20}", "--max-steps", "${MAX_STEPS:-160}", "--model-dir", "results/train/checkpoints", "--require-real-data"]

  test-swap:
    <<: *benchmark-common
    command: ["python", "experiments/test_swap_protocol.py", "--agents", "${AGENTS:-8}", "--grid-size", "${GRID_SIZE:-40}", "--episodes", "${SWAP_EPISODES:-10}", "--dataset-seed-count", "${SWAP_SEED_COUNT:-3}", "--max-steps", "${MAX_STEPS:-160}", "--model-dir", "results/train/checkpoints", "--require-real-data"]

  pipeline:
    <<: *benchmark-common
    command: ["python", "experiments/run_train_test_pipeline.py", "--require-real-data"]

  pipeline-offline:
    <<: *benchmark-common
    command: ["python", "experiments/run_train_test_pipeline.py", "--offline", "--quick"]

  benchmark-real-cities:
    <<: *benchmark-common
    command: ["python", "experiments/run_city_benchmark.py", "--agents", "${AGENTS:-8}", "--grid-size", "${GRID_SIZE:-40}", "--episodes", "${EPISODES:-10}", "--max-steps", "${MAX_STEPS:-160}", "--require-real-data"]

  benchmark-offline:
    <<: *benchmark-common
    command: ["python", "experiments/run_city_benchmark.py", "--offline", "--quick"]

  unit-test:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["pytest", "-q"]
