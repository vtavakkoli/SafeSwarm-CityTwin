x-benchmark-common: &benchmark-common
  build:
    context: .
    dockerfile: docker/Dockerfile
  volumes:
    - ./data/cache:/app/data/cache
    - ./results:/app/results

services:
  prepare-data:
    <<: *benchmark-common
    command: ["python", "experiments/prepare_real_city_data.py", "--grid-size", "${GRID_SIZE:-40}", "--require-real-data"]

  train:
    <<: *benchmark-common
    command:
      - python
      - experiments/train_real_city_policies.py
      - --agents
      - ${AGENTS:-8}
      - --grid-size
      - ${GRID_SIZE:-40}
      - --episodes
      - ${TRAIN_EPISODES:-108}
      - --validation-episodes
      - ${VALIDATION_EPISODES:-12}
      - --validation-repeats
      - ${VALIDATION_REPEATS:-2}
      - --teacher-bootstrap-scenarios
      - ${TEACHER_BOOTSTRAP_SCENARIOS:-9}
      - --max-steps
      - ${MAX_STEPS:-160}
      - --require-real-data

  upgrade-ppo:
    <<: *benchmark-common
    command:
      - python
      - experiments/upgrade_ppo_coordination_v5.py
      - --agents
      - ${AGENTS:-8}
      - --grid-size
      - ${GRID_SIZE:-40}
      - --rounds
      - ${PPO_UPGRADE_ROUNDS:-2}
      - --teacher-scenarios
      - ${PPO_TEACHER_SCENARIOS:-9}
      - --validation-episodes
      - ${VALIDATION_EPISODES:-12}
      - --validation-repeats
      - ${VALIDATION_REPEATS:-2}
      - --max-steps
      - ${MAX_STEPS:-160}
      - --require-real-data

  train-prism:
    <<: *benchmark-common
    command:
      - python
      - experiments/train_prism_patterns.py
      - --agents
      - ${AGENTS:-8}
      - --grid-size
      - ${GRID_SIZE:-40}
      - --rounds
      - ${PRISM_ROUNDS:-8}
      - --train-scenarios-per-candidate
      - ${PRISM_TRAIN_SCENARIOS:-4}
      - --validation-episodes
      - ${PRISM_VALIDATION_EPISODES:-8}
      - --validation-repeats
      - ${PRISM_VALIDATION_REPEATS:-2}
      - --max-steps
      - ${MAX_STEPS:-160}
      - --require-real-data

  train-ears:
    <<: *benchmark-common
    command:
      - python
      - experiments/train_ears_v6.py
      - --agents
      - ${AGENTS:-8}
      - --grid-size
      - ${GRID_SIZE:-40}
      - --train-episodes
      - ${EARS_TRAIN_EPISODES:-6}
      - --validation-episodes
      - ${EARS_VALIDATION_EPISODES:-8}
      - --validation-repeats
      - ${EARS_VALIDATION_REPEATS:-2}
      - --max-steps
      - ${MAX_STEPS:-160}
      - --model-dir
      - results/train/checkpoints
      - --require-real-data

  test:
    <<: *benchmark-common
    command: ["python", "experiments/test_real_city_policies.py", "--agents", "${AGENTS:-8}", "--grid-size", "${GRID_SIZE:-40}", "--episodes", "${TEST_EPISODES:-20}", "--max-steps", "${MAX_STEPS:-160}", "--model-dir", "results/train/checkpoints", "--require-real-data"]

  test-swap:
    <<: *benchmark-common
    command: ["python", "experiments/test_swap_protocol.py", "--agents", "${AGENTS:-8}", "--grid-size", "${GRID_SIZE:-40}", "--episodes", "${SWAP_EPISODES:-10}", "--dataset-seed-count", "${SWAP_SEED_COUNT:-3}", "--max-steps", "${MAX_STEPS:-160}", "--model-dir", "results/train/checkpoints", "--require-real-data"]

  pipeline:
    <<: *benchmark-common
    command: ["python", "experiments/run_train_test_pipeline.py", "--require-real-data"]

  pipeline-offline:
    <<: *benchmark-common
    command: ["python", "experiments/run_train_test_pipeline.py", "--offline", "--quick"]

  publication:
    <<: *benchmark-common
    command: ["python", "experiments/run_publication_pipeline_v7.py", "--require-real-data"]

  publication-offline:
    <<: *benchmark-common
    command: ["python", "experiments/run_publication_pipeline_v7.py", "--offline", "--quick"]

  ears-v9-select:
    <<: *benchmark-common
    command: ["python", "experiments/benchmark_ears_v9.py", "--mode", "select", "--require-real-data"]

  ears-v9-smoke:
    <<: *benchmark-common
    command: ["python", "experiments/benchmark_ears_v9.py", "--mode", "smoke", "--offline", "--agents-grid", "4,16", "--dropout-grid", "0,0.30", "--grid-size", "16", "--max-steps", "40", "--episodes", "2"]

  demo-top4:
    <<: *benchmark-common
    command:
      - python
      - experiments/demo_top4_real_city.py
      - --cities
      - ${DEMO_CITIES:-San Francisco}
      - --start-zone
      - ${DEMO_START_ZONE:-north_east}
      - --agents
      - ${AGENTS:-8}
      - --grid-size
      - ${GRID_SIZE:-40}
      - --max-steps
      - ${MAX_STEPS:-160}
      - --seed
      - ${DEMO_SEED:-1042}
      - --frame-stride
      - ${DEMO_FRAME_STRIDE:-2}
      - --fps
      - ${DEMO_FPS:-8}
      - --model-dir
      - results/train/checkpoints
      - --output-root
      - results/demo/top4-real-city
      - --require-real-data

  demo-top4-all-cities:
    <<: *benchmark-common
    command:
      - python
      - experiments/demo_top4_real_city.py
      - --all-test-cities
      - --start-zone
      - ${DEMO_START_ZONE:-north_east}
      - --agents
      - ${AGENTS:-8}
      - --grid-size
      - ${GRID_SIZE:-40}
      - --max-steps
      - ${MAX_STEPS:-160}
      - --seed
      - ${DEMO_SEED:-1042}
      - --frame-stride
      - ${DEMO_FRAME_STRIDE:-2}
      - --fps
      - ${DEMO_FPS:-8}
      - --model-dir
      - results/train/checkpoints
      - --output-root
      - results/demo/top4-real-city
      - --require-real-data

  demo-top4-offline:
    <<: *benchmark-common
    command:
      - python
      - experiments/demo_top4_real_city.py
      - --cities
      - San Francisco
      - --start-zone
      - north_east
      - --model-dir
      - results/train/checkpoints
      - --output-root
      - results/demo/top4-offline
      - --offline
      - --quick

  benchmark-real-cities:
    <<: *benchmark-common
    command: ["python", "experiments/run_city_benchmark.py", "--agents", "${AGENTS:-8}", "--grid-size", "${GRID_SIZE:-40}", "--episodes", "${EPISODES:-10}", "--max-steps", "${MAX_STEPS:-160}", "--require-real-data"]

  benchmark-offline:
    <<: *benchmark-common
    command: ["python", "experiments/run_city_benchmark.py", "--offline", "--quick"]

  unit-test:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["pytest", "-q"]

  ears-v9-train:
    <<: *benchmark-common
    command: ["python", "experiments/publication_ears_v9.py", "train", "--output-root", "${EARS_PUBLICATION_ROOT:-results/publication-v9}"]

  ears-v9-publication:
    <<: *benchmark-common
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    command: ["python", "experiments/publication_ears_v9.py", "all", "--output-root", "${EARS_PUBLICATION_ROOT:-results/publication-v9}", "--checkpoint", "${EARS_CHECKPOINT:-results/train/checkpoints/ears_safe.json}"]

  ears-v9-report:
    <<: *benchmark-common
    command: ["python", "experiments/publication_ears_v9.py", "report", "--output-root", "${EARS_PUBLICATION_ROOT:-results/publication-v9}"]

  ears-v9-publication-smoke:
    <<: *benchmark-common
    command: ["python", "experiments/publication_ears_v9.py", "smoke", "--offline", "--output-root", "results/publication-v9-smoke"]

  ears-v9-audit:
    <<: *benchmark-common
    command: ["python", "tools/publication_readiness_v9.py", "--study-root", "${EARS_REVIEW_SOURCE:-results/publication-v9-sparse-filter-v2}", "--output-root", "${EARS_AUDIT_ROOT:-results/publication-v9-audit}"]

  ears-v9-mechanism-probe:
    <<: *benchmark-common
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    command: ["python", "tools/mechanism_probe_v9.py", "--study-root", "${EARS_REVIEW_SOURCE:-results/publication-v9-sparse-filter-v2}", "--output-root", "${EARS_PROBE_ROOT:-results/publication-v9-mechanism-pilot}", "--profile", "${EARS_PROBE_PROFILE:-pilot}"]
