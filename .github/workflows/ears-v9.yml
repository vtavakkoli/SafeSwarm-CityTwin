name: EARS v9 isolated verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/agents/ears_v9.py'
      - 'experiments/benchmark_ears_v9.py'
      - 'tests/test*ears_v9.py'
      - 'configs/confirmation_protocol_v9.json'
      - '.github/workflows/ears-v9.yml'

permissions:
  contents: read

jobs:
  v9-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Policy and evaluation contracts
        run: python -m pytest -q tests/test_ears_v9.py tests/test_benchmark_ears_v9.py tests/test_ears_v8.py tests/test_ears_v6.py tests/test_runtime_monitor.py tests/test_safety_rules.py
      - name: Synthetic integration, never publication evidence
        run: python experiments/benchmark_ears_v9.py --mode smoke --offline --agents-grid 4,16 --dropout-grid 0,0.30 --grid-size 16 --max-steps 40 --episodes 2 --output-root results/v9/ci-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ears-v9-synthetic-smoke
          path: results/v9/ci-smoke/
