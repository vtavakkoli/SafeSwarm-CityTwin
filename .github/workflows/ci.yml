name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
      - name: Offline integration benchmark
        run: python experiments/run_city_benchmark.py --offline --quick --output-root results/ci-benchmark
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: safeswarm-ci-benchmark
          path: results/ci-benchmark
