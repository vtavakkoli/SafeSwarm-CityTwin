name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
      - name: Offline integration benchmark
        run: python experiments/run_city_benchmark.py --offline --quick --output-root results/ci-benchmark
      - name: Offline v5 PRISM SWAP smoke pipeline
        run: |
          python experiments/run_train_test_pipeline.py --offline --quick
          test -f results/train/training_summary.csv
          test -f results/train/validation_improvements.json
          test -f results/train/coordination_upgrade_summary.csv
          test -f results/train/coordination_upgrade_manifest.json
          test -f results/train/prism_tuning_history.csv
          test -f results/train/prism_pattern_summary.csv
          test -f results/train/prism_ant_summary.csv
          test -f results/train/prism_manifest.json
          test -f results/train/checkpoints/prism_safe.json
          test -f results/train/checkpoints/prism_x_safe.json
          test -f results/train/checkpoints/prism_plus_safe.json
          test -f results/train/checkpoints/prism_star_safe.json
          test -f results/train/checkpoints/prism_ant_safe.json
          test -f results/test/tables/overall_ranking.csv
          test -f results/swap-test/tables/overall_ranking.csv
          test -f results/swap-test/manifest.json
          test -f results/report.html
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          prism = json.loads(Path("results/train/prism_manifest.json").read_text())
          upgrade = json.loads(Path("results/train/coordination_upgrade_manifest.json").read_text())
          test = json.loads(Path("results/test/manifest.json").read_text())
          swap = json.loads(Path("results/swap-test/manifest.json").read_text())
          ranking = pd.read_csv("results/test/tables/overall_ranking.csv")
          upgrade_summary = pd.read_csv("results/train/coordination_upgrade_summary.csv")
          swap_datasets = pd.read_csv("results/swap-test/tables/dataset_manifest.csv")

          assert prism["algorithm"].startswith("PRISM:")
          assert prism["selected_pattern"] in {"x", "plus", "star"}
          assert "test/SWAP never consulted" in prism["selection_rule"]
          assert prism["hybrid_algorithm"].startswith("PRISM-Ant")
          assert set(upgrade["students"]) == {"GRPO-Safe", "IPPO-Safe", "MAPPO-Safe", "HAPPO-Safe"}
          assert (upgrade_summary["teacher_examples"] > 0).all()
          assert test["training_version"] == "SafeSwarm PPO/GRPO/PRISM v5"
          assert test["deterministic_learned_evaluation"] is True
          assert test["obsolete_sparx_names_present"] is False
          assert swap["used_for_model_selection"] is False
          assert swap["dataset_changed_pass"] is True
          assert swap["unique_signatures_pass"] is True
          assert (swap_datasets["target_count"] < swap_datasets["original_target_count"]).all()
          names = set(ranking["strategy"])
          assert {"PRISM-Safe", "PRISM-Ant-Safe", "PRISM-X-Safe", "PRISM-Plus-Safe", "PRISM-Star-Safe"} <= names
          assert not any(name.startswith("SPARX") for name in names)
          PY
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: safeswarm-v5-ci-results
          path: |
            results/ci-benchmark
            results/prepare-data
            results/train
            results/test
            results/swap-test
            results/report.html
