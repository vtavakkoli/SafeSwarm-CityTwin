name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
      - name: Offline integration benchmark
        run: python experiments/run_city_benchmark.py --offline --quick --output-root results/ci-benchmark
      - name: Offline v6 EARS PRISM SWAP smoke pipeline
        run: |
          python experiments/run_train_test_pipeline.py --offline --quick
          test -f results/train/training_summary.csv
          test -f results/train/coordination_upgrade_summary.csv
          test -f results/train/prism_manifest.json
          test -f results/train/ears_candidate_history.csv
          test -f results/train/ears_summary.csv
          test -f results/train/ears_manifest.json
          test -f results/train/checkpoints/prism_safe.json
          test -f results/train/checkpoints/prism_ant_safe.json
          test -f results/train/checkpoints/ears_safe.json
          test -f results/train/checkpoints/ears_np_safe.json
          test -f results/train/checkpoints/h_mappo_ears_safe.json
          test -f results/test/tables/overall_ranking.csv
          test -f results/swap-test/tables/overall_ranking.csv
          test -f results/swap-test/manifest.json
          test -f results/report.html
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          prism = json.loads(Path("results/train/prism_manifest.json").read_text())
          ears = json.loads(Path("results/train/ears_manifest.json").read_text())
          test = json.loads(Path("results/test/manifest.json").read_text())
          swap = json.loads(Path("results/swap-test/manifest.json").read_text())
          ranking = pd.read_csv("results/test/tables/overall_ranking.csv")
          ears_summary = pd.read_csv("results/train/ears_summary.csv")
          swap_datasets = pd.read_csv("results/swap-test/tables/dataset_manifest.csv")

          assert prism["algorithm"].startswith("PRISM:")
          assert prism["selected_pattern"] in {"x", "plus", "star"}
          assert ears["version"] == "SafeSwarm v6 EARS"
          assert ears["ant_reference_unchanged"] is True
          assert "test and SWAP never consulted" in ears["selection_rule"]
          assert set(ears_summary["strategy"]) == {
              "EARS-Safe", "EARS-NP-Safe", "H-MAPPO-EARS-Safe"
          }
          assert test["training_version"] == "SafeSwarm PPO/GRPO/PRISM/EARS v6"
          assert test["ant_reference_unchanged"] is True
          assert swap["used_for_model_selection"] is False
          assert swap["dataset_changed_pass"] is True
          assert swap["unique_signatures_pass"] is True
          assert (swap_datasets["target_count"] < swap_datasets["original_target_count"]).all()
          names = set(ranking["strategy"])
          assert {
              "AntSwarmSafe",
              "PRISM-Ant-Safe",
              "EARS-Safe",
              "EARS-NP-Safe",
              "H-MAPPO-EARS-Safe",
          } <= names
          assert not any(name.startswith("SPARX") for name in names)
          PY
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: safeswarm-v6-ci-results
          path: |
            results/ci-benchmark
            results/prepare-data
            results/train
            results/test
            results/swap-test
            results/report.html
