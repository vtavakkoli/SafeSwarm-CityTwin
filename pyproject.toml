[project]
name = "safeswarm-citytwin"
version = "2.0.0"
description = "Safety-constrained multi-agent benchmark on real-city digital twins"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Vahid Tavakkoli"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["data/cache", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
